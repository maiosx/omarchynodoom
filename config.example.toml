# npost — example configuration (plugin: nodoom.composer)
#
# Copy to ~/.config/npost/config.toml and keep it private:
#     mkdir -m 700 -p ~/.config/npost
#     cp config.example.toml ~/.config/npost/config.toml
#     chmod 600 ~/.config/npost/config.toml
#
# The backend also generates this template with correct permissions on first run.
#
# ------------------------------------------------------------- mode ------
# Browser composer (the only mode)
#    Posts are handed off to https://nodoom.app/composer?text=…
#    Nodoom prefills the textarea from that query. Nothing is published
#    until you press Post there. No API keys needed.
#
# copy_draft = true  ->  also copy the draft to the clipboard with
#    wl-copy (Wayland / Omarchy), xclip, or xsel, as a backup. Press
#    Ctrl+V in the composer if the box is empty.

copy_draft = true
